<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>love.py</title>
<style>
:root{--bg:#0b0f0c;--fg:#7CFC9A;--dim:#4a9a62;--heart:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);min-height:100%}
body{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;padding:20px 16px}
#t{white-space:pre;overflow-x:auto;max-width:100%}
.p{color:var(--dim)}
.h{color:var(--heart);line-height:1.05;display:inline-block;font-size:12px}
.c{display:inline-block;width:8px;height:15px;background:var(--fg);vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div id="t"></div>
<script>
var out=document.getElementById("t");
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var cur='<span class="c"></span>';
var done="";
function render(live){out.innerHTML=done+(live||"")+cur}
async function type(s,speed){
  var buf="";
  for(var i=0;i<s.length;i++){buf+=s[i];render('<span class="p">$ </span>'+buf);await sleep(speed)}
  done+='<span class="p">$ </span>'+buf+"\n";render();
}
async function line(s,ms){done+=s+"\n";render();await sleep(ms)}
function heart(){
  var rows=[];
  for(var y=1.3;y>=-1.2;y-=0.1){
    var r="";
    for(var x=-1.4;x<=1.4;x+=0.05){
      var v=Math.pow(x*x+y*y-1,3)-x*x*y*y*y;
      r+=v<=0?"♥":" ";
    }
    rows.push(r);
  }
  return rows;
}
async function run(){
  done="";render();
  await sleep(600);
  await type("python love.py",90);
  await sleep(400);
  await line("Loading modules...",500);
  await line("[ok] import numpy as np",350);
  await line("[ok] import matplotlib",350);
  await line("Solving (x² + y² − 1)³ − x²y³ = 0",700);
  var bar="";
  for(var i=0;i<=20;i++){
    bar="["+"#".repeat(i)+".".repeat(20-i)+"] "+(i*5)+"%";
    render(bar);await sleep(110);
  }
  done+=bar+"\n\n";render();
  await sleep(400);
  var rows=heart();
  for(var j=0;j<rows.length;j++){
    done+='<span class="h">'+rows[j]+"</span>\n";
    render();await sleep(70);
  }
  await sleep(500);
  await line("\nProcess finished with exit code 0",300);
  out.innerHTML=done+'<span class="p">$ </span>'+cur;
}
run();
</script>
</body>
</html>
